# HANASO preview — learn.kotodama.ir (Japanese learning product for Persian speakers).
# Replaced the retired "genesis-learn" site (same vhost) on 2026-11-01.
# TLS terminates on haproxy (*:443, ALPN http/1.1 -> nginx:81 send-proxy; the :82
# h2 listener mirrors the host pattern but is currently reserved — haproxy does
# not advertise h2). Same architecture as sites-enabled/kotodama. Port-80
# ACME/redirect mirrors sites-enabled/kotodama-acme. Upstream is the hanaso-web
# docker container (compose project "hanaso", loopback-only 127.0.0.1:3100).
upstream hanaso_web_app {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name learn.kotodama.ir;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/bigbluebutton-default/assets;
    }
    location = /.well-known/acme-challenge/ { return 404; }

    location / { return 301 https://learn.kotodama.ir$request_uri; }
}

server {
    listen 127.0.0.1:81 proxy_protocol;
    listen [::1]:81;
    listen 127.0.0.1:82 proxy_protocol;
    listen [::1]:82;
    server_name learn.kotodama.ir;

    absolute_redirect off;
    access_log /var/log/nginx/hanaso-learn.access.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;

    location /_next/static/ {
        proxy_pass http://hanaso_web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Cache-Control comes from the app itself (Next.js standalone sends
        # "public, max-age=31536000, immutable") — no duplicate header here.
        # add_header inheritance: any add_header in a location suppresses the
        # server-level set, so ALL three security headers are repeated here.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        proxy_pass http://hanaso_web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
