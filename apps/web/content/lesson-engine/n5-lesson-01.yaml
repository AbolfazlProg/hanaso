grammar:
  - id: gr-desu
    patternJa: AはBです
    functionFa: «A، B است» — معرفی و هویت؛ با か پایان‌بخشی پرسشی می‌شود و بدون فاعل هم طبیعی است
    formulaFa: AはBです / AはBですか / （A）はBです
    persianEquivalentFa: 'برعکس فارسی: موضوع با は نشان داده می‌شود و «است» به شکل مؤدانه です است'
    commonErrors:
      - خواندن は به‌صورت «ها» — به‌عنوان ذره همیشه «وا» خوانده می‌شود
      - افزودن さん به نام خودش (やまださんです — غلط؛ خودش やまだです می‌گوید)
      - برگردان تحت‌اللفظی «است» به جای です در پایان جمله
    examples:
      - ja: わたしは にほんじんです。
        reading: watashiwa nihonjindesu
        fa: من ژاپنی‌ام.
        kind: anchor
      - ja: ワンさんは がくせいです。
        reading: wangsanwa gakuseedesu
        fa: خانم وان دانشجو است.
        kind: simple
      - ja: わたしは インドの がくせいです。
        reading: watashiwa indono gakuseedesu
        fa: من دانشجوی هند هستم.
        kind: varied
      - ja: あのかたは どなたですか。
        reading: anokatawa donatadesuka
        fa: آن شخص کیست؟
        kind: varied
      - ja: はじめまして、やまだです。
        reading: hajimemashite yamadadesu
        fa: خوشبختم؛ یامادا هستم (حذف فاعل).
        kind: varied
    sourceRef:
      artifact: n5-booklet
      lesson: 1
      page: 7
      section: bumpoo
      locator: patterns 1+3+7
    flags: []
  - id: gr-neg-mo
    patternJa: AはBではありません / AもBです
    functionFa: «A، B نیست» + «A هم B است» — اصلاح مؤدانه و اشتراک
    formulaFa: AはBでは（じゃ）ありません / N2もN3です
    persianEquivalentFa: では رسمی‌تر و じゃ خودی‌تر است؛ も به‌جای は می‌نشیند و معنی «هم» می‌دهد
    commonErrors:
      - استفاده از じゃ در موقعیت رسمی (با صاحب کافه/غریبه)
      - جای‌گذاری も به‌جای は در جملهٔ منفی
    examples:
      - ja: キムさんは ちゅうごくじんでは ありません。かんこくじんです。
        reading: kimsanwa chuugokujindewa arimasen kankokujindesu
        fa: خانم کیم چینی نیست؛ کره‌ای است.
        kind: anchor
      - ja: わたしは がくせいでは ありません。
        reading: watashiwa gakuseedewa arimasen
        fa: من دانشجو نیستم.
        kind: simple
      - ja: わたしは ちゅうごくじんです。わたしの ともだちも ちゅうごくじんです。
        reading: watashiwa chuugokujindesu watashinotomodachimo chuugokujindesu
        fa: من چینی‌ام؛ دوستم هم چینی است.
        kind: varied
    sourceRef:
      artifact: n5-booklet
      lesson: 1
      page: 7
      section: bumpoo
      locator: patterns 2+6
    flags: []
