stations:
- id: stn-fm01-01-anchor
  domain: anchor
  type: teaching
  objectiveFa: کل مکالمهٔ ۱۳ نوبتی را یک‌بار بشنو و حس «شکاف دانستن» را تجربه کن
  order: 1
  prerequisites: []
- id: stn-fm01-02-vocab
  domain: vocab
  type: teaching
  objectiveFa: '۸ واژهٔ هویت را با صدا بشناس: من، پسوند さん، سه ملیت، دانشگاه، استاد، آن شخص'
  order: 2
  prerequisites:
  - stn-fm01-01-anchor
- id: stn-fm01-03-grammar-desu
  domain: grammar
  type: teaching
  objectiveFa: 'جملهٔ هویت را بفهم و بساز: わたしは にほんじんです'
  order: 3
  prerequisites:
  - stn-fm01-02-vocab
- id: stn-fm01-04-structure
  domain: grammar
  type: teaching
  objectiveFa: بفهم چرا سورا در نوبت ۴ «من» را نمی‌گوید — و چرا ترتیب برای تو غریبه نیست
  order: 4
  prerequisites:
  - stn-fm01-03-grammar-desu
- id: stn-fm01-05-grammar-qa
  domain: grammar
  type: teaching
  objectiveFa: هویت را بپرس (ですか) و شنیده‌ات را تأیید کن (ですね)
  order: 5
  prerequisites:
  - stn-fm01-03-grammar-desu
- id: stn-fm01-06-expression
  domain: vocab
  type: teaching
  objectiveFa: فرمول‌های آشنایی را در جای درست به‌کار ببر
  order: 6
  prerequisites:
  - stn-fm01-02-vocab
- id: stn-fm01-07-listen
  domain: listening
  type: teaching
  objectiveFa: 'بدون متن دنبال کن: جیست، چه‌کسی، و تفاوت‌های صدایی'
  order: 7
  prerequisites:
  - stn-fm01-02-vocab
  - stn-fm01-05-grammar-qa
- id: stn-fm01-08-practice
  domain: practice
  type: practice
  objectiveFa: همهٔ آموخته‌های نوبت‌های ۱–۸ را بازیابی کن
  order: 8
  prerequisites:
  - stn-fm01-02-vocab
  - stn-fm01-03-grammar-desu
  - stn-fm01-05-grammar-qa
  - stn-fm01-06-expression
  - stn-fm01-07-listen
- id: stn-fm01-09-integrate
  domain: transfer
  type: teaching
  objectiveFa: خودت را در موقعیت واقعی معرفی کن
  order: 9
  prerequisites:
  - stn-fm01-08-practice
- id: stn-fm01-10-reconnect
  domain: anchor
  type: teaching
  objectiveFa: همان مکالمه را با تمرکز نوبت‌های ۹–۱۴ دوباره بشنو
  order: 10
  prerequisites:
  - stn-fm01-09-integrate
- id: stn-fm01-11-vocab2
  domain: vocab
  type: teaching
  objectiveFa: ۳ واژهٔ تازه (کره‌ای، از، آمد) + بازیافت واژه‌های قبل
  order: 11
  prerequisites:
  - stn-fm01-10-reconnect
- id: stn-fm01-12-grammar-mo
  domain: grammar
  type: teaching
  objectiveFa: 'با も بگو «او هم مثل قبلی است»: キムさんも ちゅうごくじんですか'
  order: 12
  prerequisites:
  - stn-fm01-11-vocab2
- id: stn-fm01-13-grammar-dewa
  domain: grammar
  type: teaching
  objectiveFa: 'فرض غلط را مؤدبانه رد کن: ちゅうごくじんでは ありません'
  order: 13
  prerequisites:
  - stn-fm01-12-grammar-mo
- id: stn-fm01-14-expression
  domain: vocab
  type: teaching
  objectiveFa: سه واکنش گفتاری را در جای درست به‌کار ببر
  order: 14
  prerequisites:
  - stn-fm01-13-grammar-dewa
- id: stn-fm01-15-listen
  domain: listening
  type: teaching
  objectiveFa: かんこく را از かこく تمیز بده و ردّ مؤدبانه را بشناس
  order: 15
  prerequisites:
  - stn-fm01-11-vocab2
  - stn-fm01-14-expression
- id: stn-fm01-16-grammar-kara
  domain: grammar
  type: teaching
  objectiveFa: 'بگو از کجا آمده‌ای: かんこくから きました / イランから きました'
  order: 16
  prerequisites:
  - stn-fm01-11-vocab2
- id: stn-fm01-17-practice
  domain: practice
  type: practice
  objectiveFa: 'الگوهای هر دو واحد را کنار هم بازیابی کن: は/も · ですか/ではありません · خاستگاه'
  order: 17
  prerequisites:
  - stn-fm01-16-grammar-kara
  - stn-fm01-15-listen
- id: stn-fm01-18-integrate
  domain: transfer
  type: teaching
  objectiveFa: وقتی میکی حدس می‌زند چینی هستی، مؤدبانه اصلاح کن و خودت را کامل معرفی کن
  order: 18
  prerequisites:
  - stn-fm01-17-practice
- id: stn-fm01-opt-countries
  domain: grammar
  type: teaching
  objectiveFa: الگوی 〜じん را با کشورهای بیشتر تمرین کن — پیش‌نمایش 〜ご
  order: 19
  prerequisites:
  - stn-fm01-02-vocab
- id: stn-fm01-opt-review-desu
  domain: review
  type: review
  objectiveFa: ۴ بافت تازه با جای‌خالی — الگو را خودت کامل کن
  order: 20
  prerequisites:
  - stn-fm01-03-grammar-desu
- id: stn-fm01-opt-jobs
  domain: grammar
  type: teaching
  objectiveFa: ۸ واژهٔ شغل را بشناس تا شغل خودت را بگویی — فقط با انتخاب صریح تو کارت می‌شود
  order: 21
  prerequisites:
  - stn-fm01-13-grammar-dewa
- id: stn-fm01-opt-drill
  domain: review
  type: review
  objectiveFa: 'جفت‌های مرگبار فصل را جدا کن: ですか/ですね · は/も · طول واکه'
  order: 22
  prerequisites:
  - stn-fm01-17-practice
- id: stn-fm01-23-kanji
  domain: kanji
  type: teaching
  objectiveFa: کانجی‌های 人 و 国 را در واژه‌های ژاپنی/چینی/کره‌ای/ایرانی که آموخته‌ای بشناسد و معنا و خوانش هر کانجی را به‌خوبی
    جدا کند
  order: 23
  prerequisites:
  - stn-fm01-02-vocab
  - stn-fm01-11-vocab2
notes:
- ایستگاه اختصاصی کانجی پس از هر دو ایستگاه واژگان حامل anchorها (سفارش ۲ و ۱۱) قرار گرفته است — خوانش‌ها فقط داخل واژه‌های
  آموزش‌دیدهٔ قبلی (D-0006).
- بقیهٔ کانجی‌های فصل (日 本 中 大 学 先 生 来) فقط ۱ واژهٔ anchor دارند — تدریس اختصاصی آن‌ها به فصل‌های بعدی واگذار شده (قاعدهٔ
  ≥۲ anchor).
