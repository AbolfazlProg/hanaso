titleFa: 'طرح جایگاه‌گذاری کانجی — فصل ۰۲ (نمونهٔ فاز ۱: ایستگاه اختصاصی 人 و 国)'
canDoFa: در پایان این فصل می‌توانی خودت را کامل معرفی کنی (نام، ملیت، خاستگاه)، هویت دیگران را بپرسی و تأیید کنی، فرض غلط
  را مؤدبانه رد کنی — و کل مکالمهٔ ۱۴ نوبتی را بفهمی.
