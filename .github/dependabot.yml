version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # KB dependency policy: exact pins + lockfile; security patches immediate.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # OTD-004 (spike 2026-11-01): typescript-eslint does not support TS 7 yet — stay on 6.0.3
      - dependency-name: typescript
        versions: ['7.x']
      # @types/node must match the runtime major (Node 24 — ADR-003 KB)
      - dependency-name: '@types/node'
        versions: ['25.x', '26.x']
