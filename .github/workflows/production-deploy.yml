name: Production Deploy (learn.kotodama.ir)

# HANASO-PRODUCTION-REMEDIATION — the GitHub-Actions production deployment.
#
# Contract (mission §6):
#   - manual workflow_dispatch ONLY (never a moving branch/tag, never PRs)
#   - the exact immutable target commit SHA is an input, defaulted to the
#     release commit of this remediation
#   - serialized deployments (concurrency: production-deploy, cancel-in-progress=false)
#   - least-privilege: contents:read only; no secrets in logs (password/secret
#     values are passed to sshpass via stdin env, never echoed)
#   - HANASO-only actions on the VPS: the updater (update-hanaso.sh) is the
#     project's own staged deploy (DB backup → build pinned SHA → health gates
#     → auto-rollback); KOTODAMA/BBB/FreeSWITCH/VOICEVOX/nginx/HAProxy are
#     never touched by it.
#   - the runner connects to the VPS over SSH (port 22) — the runner network
#     is not subject to the sandbox egress restriction.

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact product commit SHA to deploy (40 hex chars)'
        required: true
        type: string
      target_version:
        description: 'Release version label (e.g. 1.1.0-hanaso31-r01)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy (staged updater, pinned SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # never printed; used only by the sshpass invocation
      SSHPASS: ${{ secrets.VPS_PASSWORD }}
    steps:
      - name: Validate inputs (immutable 40-hex SHA)
        run: |
          sha="${{ inputs.target_sha }}"
          ver="${{ inputs.target_version }}"
          if ! echo "$sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::target_sha must be an exact 40-char commit SHA (got: ${sha:0:12}…)"
            exit 1
          fi
          if [ -z "$ver" ]; then
            echo "::error::target_version is required"
            exit 1
          fi
          echo "deploy target: $ver @ $sha"

      - name: Record pre-deploy production identity
        id: pre
        run: |
          echo "=== pre-deploy /api/health ==="
          curl -fsS --max-time 30 https://learn.kotodama.ir/api/health || echo "(pre-deploy health unreachable — continuing; updater has its own gates)"

      - name: Install SSH tooling
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass openssh-client >/dev/null

      - name: SSH — run the pinned staged updater on the VPS
        id: sshdeploy
        run: |
          set -euo pipefail
          SHA='${{ inputs.target_sha }}'
          VER='${{ inputs.target_version }}'
          # immutable: the updater runs from EXACTLY the commit this workflow was dispatched on
          UPDATER_SHA="${{ github.sha }}"
          echo "updater pinned at the dispatch commit: $UPDATER_SHA"
          export SSHPASS
          # StrictHostKeyChecking=accept-new: first-use TOFU; password via SSHPASS env (not argv, not logged)
          sshpass -e ssh -p "${{ secrets.VPS_SSH_PORT }}" -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/gh_known_hosts -o ConnectTimeout=25 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "HANASO_TARGET_SHA='$SHA' HANASO_TARGET_VERSION='$VER' HANASO_DEPLOY_SHA='$UPDATER_SHA' bash -s" <<'REMOTE'
            set -euo pipefail
            echo "=== remote: pre-deploy state ==="
            docker ps --format '{{.Names}}\t{{.Image}}' | grep -i hanaso || true
            cd /opt/hanaso 2>/dev/null && grep -o 'HANASO_WEB_IMAGE=.*' .env || echo "(deploy dir env not readable this way — updater will handle)"
            echo "=== remote: download bootstrap (pinned) and run the staged updater ==="
            T=/tmp/hanaso-bootstrap-gha.sh
            curl -fsSL --connect-timeout 10 --max-time 120 \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/AbolfazlProg/hanaso/contents/infra/deploy/bootstrap-hanaso.sh?ref=$UPDATER_SHA" -o "$T"
            bash "$T"
          REMOTE

      - name: Post-deploy health verification (served commit must equal target)
        run: |
          set -euo pipefail
          SHA='${{ inputs.target_sha }}'
          VER='${{ inputs.target_version }}'
          ok=0
          for i in $(seq 1 30); do
            H="$(curl -fsS --max-time 20 https://learn.kotodama.ir/api/health || true)"
            if echo "$H" | grep -q "\"commit\":\"$SHA\"" && echo "$H" | grep -q "\"version\":\"$VER\""; then
              echo "HEALTH OK after ${i} checks:"; echo "$H"
              ok=1; break
            fi
            sleep 5
          done
          if [ "$ok" != 1 ]; then
            echo "::error::production did not serve $VER @ $SHA within the health window"
            curl -fsS --max-time 20 https://learn.kotodama.ir/api/health || true
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## Production Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- target: ${{ inputs.target_version }} @ ${{ inputs.target_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- site: https://learn.kotodama.ir" >> $GITHUB_STEP_SUMMARY
          echo "- final health: $(curl -fsS --max-time 20 https://learn.kotodama.ir/api/health || echo unreachable)" >> $GITHUB_STEP_SUMMARY
